name: ✨ Feature Request
description: Suggest a new feature or enhancement for Roognis
labels: ["enhancement", "feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request

        Suggest a new idea, functionality, or improvement for the Roognis platform.
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 📌 Feature Summary
      placeholder: e.g. "Add interactive demo section for AI tutoring"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation
      description: Explain *why* this feature is needed. What problem does it solve or what value does it add?
      placeholder: |
        This feature would help visitors better understand our AI tutoring capabilities by...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Detailed Description
      description: Describe the feature in detail. How should it work?
      placeholder: |
        The feature should include:
        - Interactive chat interface
        - Sample questions and responses
        - Visual indicators of AI capabilities
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 🧩 Suggested Implementation
      description: (Optional) Share any ideas for how this could be implemented
      placeholder: |
        Technical considerations:
        - New React component for interactive demo
        - Integration with existing design system
        - Mobile-responsive design
    validations:
      required: false

  - type: dropdown
    id: complexity
    attributes:
      label: 🧠 Estimated Complexity
      options:
        - Low (Simple UI update, content changes)
        - Medium (New component, moderate styling changes)
        - High (Complex functionality, major redesign, external integrations)
      multiple: false
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Category
      multiple: true
      options:
        - UI/UX Enhancement
        - New Page/Section
        - Performance Improvement
        - Accessibility
        - Mobile Experience
        - Content/Copy
        - Animation/Interaction
        - SEO/Analytics
        - Integration
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 📅 Priority
      options:
        - Low (Nice to have, not urgent)
        - Medium (Important for user experience)
        - High (Critical for product goals)
      multiple: false
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: 🔗 Related Issues / References
      description: Reference related discussions, competitor examples, or design inspiration
      placeholder: |
        - Related to #42
        - Similar to feature on [competitor website]
        - Design inspiration: [link]
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 🧠 Additional Notes
      description: Any other considerations, edge cases, or implementation details
      placeholder: |
        Additional considerations:
        - Impact on existing users
        - Potential challenges
        - Alternative approaches
    validations:
      required: false