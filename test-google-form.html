<!DOCTYPE html>
<html>
<head>
    <title>Google Forms Test</title>
</head>
<body>
    <h1>Test Google Forms Submission</h1>
    
    <h2>Method 1: Direct Form Submission</h2>
    <form action="https://docs.google.com/forms/d/e/1FAIpQLScX3qrQaoBaxaEdYzORFajoPsKPy6N9QMOEjfTEvjijZtqT7g/formResponse" method="POST" target="_blank">
        <div>
            <label>Name:</label>
            <input type="text" name="entry.509063275" value="Test Name" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" name="entry.726412804" value="test@example.com" required>
        </div>
        <div>
            <label>Role:</label>
            <select name="entry.1664648099" required>
                <option value="Entrepreneur">Entrepreneur</option>
                <option value="Intrapreneur">Intrapreneur</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div>
            <label>Message:</label>
            <textarea name="entry.1322006156" required>Test message from HTML form</textarea>
        </div>
        <div>
            <label>
                <input type="checkbox" name="entry.749397425" value="Yes" checked>
                I agree to receive communications from Roognis
            </label>
        </div>
        <button type="submit">Submit to Google Forms</button>
    </form>

    <h2>Method 2: Fetch API Test</h2>
    <button onclick="testFetchSubmission()">Test Fetch Submission</button>
    <div id="result"></div>

    <script>
        async function testFetchSubmission() {
            const formData = new URLSearchParams();
            formData.append('entry.509063275', 'Test Name Fetch');
            formData.append('entry.726412804', 'testfetch@example.com');
            formData.append('entry.1664648099', 'Entrepreneur');
            formData.append('entry.1322006156', 'Test message from fetch API');
            formData.append('entry.749397425', 'Yes'); // Communication consent

            try {
                const response = await fetch('https://docs.google.com/forms/d/e/1FAIpQLScX3qrQaoBaxaEdYzORFajoPsKPy6N9QMOEjfTEvjijZtqT7g/formResponse', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString(),
                    mode: 'no-cors' // Google Forms doesn't support CORS for direct submission
                });

                document.getElementById('result').innerHTML = `
                    <p>Fetch completed (no-cors mode - status unknown)</p>
                    <p>Check your Google Form responses to see if it worked</p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <p>Error: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
